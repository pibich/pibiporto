<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e1116;color:#e6edf3;font-family:'IBM Plex Sans',sans-serif}
::placeholder{color:#565f6b}
</style>
</helmet>

<div data-screen-label="Admin Dashboard" style="min-height:100vh;background:#0e1116">

  <!-- topbar -->
  <nav style="position:sticky;top:0;z-index:50;background:rgba(14,17,22,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)">
    <div style="max-width:920px;margin:0 auto;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600"><span style="color:#5ba3f5">~/admin</span>/projects</div>
      <div style="display:flex;gap:20px;align-items:center">
        <a href="Portofolio Hi-fi.dc.html" style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#8b949e;text-decoration:none" style-hover="color:#e6edf3">lihat website ↗</a>
        <a href="Admin Login.dc.html" style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#8b949e;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 13px;text-decoration:none" style-hover="color:#e6edf3;border-color:rgba(255,255,255,.3)">logout →</a>
      </div>
    </div>
  </nav>

  <div style="max-width:920px;margin:0 auto;padding:44px 28px 80px">

    <!-- header -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
      <div>
        <h1 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em">Daftar Project</h1>
        <p style="margin:6px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#8b949e">{{ projectCount }} project · perubahan langsung tampil di homepage</p>
      </div>
      <button onClick="{{ openAdd }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#0e1116;background:#5ba3f5;border:none;border-radius:8px;padding:11px 18px;cursor:pointer" style-hover="opacity:.85">+ Tambah Project</button>
    </div>

    <!-- list -->
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:28px">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
        <div style="background:#141920;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;transition:border-color .2s" style-hover="border-color:rgba(255,255,255,.22)">
          <div style="width:72px;height:48px;flex:none;border-radius:7px;border:1px dashed rgba(255,255,255,.2);background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#565f6b">img</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15.5px;font-weight:600">{{ p.title }}</div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e;margin-top:4px">{{ p.tech }}</div>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#565f6b">{{ p.date }}</div>
          <div style="display:flex;gap:8px">
            <button onClick="{{ p.edit }}" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8b949e;background:none;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 13px;cursor:pointer" style-hover="color:#e6edf3;border-color:rgba(255,255,255,.3)">edit</button>
            <button onClick="{{ p.remove }}" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#e0645a;background:none;border:1px solid rgba(224,100,90,.35);border-radius:6px;padding:7px 13px;cursor:pointer" style-hover="background:rgba(224,100,90,.12)">hapus</button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- modal tambah/edit -->
  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:100;background:rgba(5,7,10,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px" onClick="{{ closeModal }}">
      <div style="width:520px;max-width:100%;max-height:90vh;overflow:auto;background:#141920;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:28px" onClick="{{ stopClick }}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2 style="margin:0;font-size:19px;font-weight:700">{{ modalTitle }}</h2>
          <button onClick="{{ closeModal }}" style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:#8b949e;background:none;border:none;cursor:pointer" style-hover="color:#e6edf3">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;margin-top:22px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e">judul project</label>
            <input type="text" placeholder="Nama project" defaultValue="{{ modalFieldTitle }}" style="font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:#e6edf3;background:#0e1116;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;outline:none" style-focus="border-color:#5ba3f5" />
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e">deskripsi singkat</label>
            <textarea placeholder="Deskripsi 1-2 kalimat…" rows="3" style="font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:#e6edf3;background:#0e1116;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;outline:none;resize:vertical" style-focus="border-color:#5ba3f5"></textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div style="display:flex;flex-direction:column;gap:6px">
              <label style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e">link demo</label>
              <input type="text" placeholder="https://…" style="font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:#e6edf3;background:#0e1116;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;outline:none" style-focus="border-color:#5ba3f5" />
            </div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <label style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e">link repo</label>
              <input type="text" placeholder="https://github.com/…" style="font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:#e6edf3;background:#0e1116;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;outline:none" style-focus="border-color:#5ba3f5" />
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e">tech stack</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{ techOptions }}" as="t" hint-placeholder-count="6">
                <button onClick="{{ t.toggle }}" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{ t.color }};background:none;border:1px solid {{ t.border }};border-radius:6px;padding:6px 12px;cursor:pointer">{{ t.name }}</button>
              </sc-for>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b949e">screenshot</label>
            <div style="height:110px;border:1.5px dashed rgba(255,255,255,.2);border-radius:10px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 8px,transparent 8px 16px);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#565f6b" style-hover="border-color:#5ba3f5">klik atau drop gambar di sini</div>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
            <button onClick="{{ closeModal }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#8b949e;background:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:11px 18px;cursor:pointer" style-hover="color:#e6edf3">batal</button>
            <button onClick="{{ closeModal }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#0e1116;background:#5ba3f5;border:none;border-radius:8px;padding:11px 18px;cursor:pointer" style-hover="opacity:.85">simpan</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    modalOpen: false,
    editing: null,
    selectedTech: ["Next.js", "Tailwind CSS"],
    projects: [
      { id: 1, title: "Landing Page Toko Online", tech: "Next.js · Tailwind CSS · Supabase", date: "2026-05" },
      { id: 2, title: "Company Profile Interaktif", tech: "HTML · CSS · JavaScript", date: "2026-03" },
      { id: 3, title: "Dashboard Manajemen Konten", tech: "Next.js · Supabase", date: "2026-01" },
      { id: 4, title: "Web Overlay Streaming", tech: "HTML · CSS · JavaScript", date: "2025-11" }
    ]
  };

  renderVals() {
    const techNames = ["HTML", "CSS", "JavaScript", "Next.js", "Tailwind CSS", "Supabase"];
    const sel = this.state.selectedTech;
    return {
      projectCount: this.state.projects.length,
      projects: this.state.projects.map((p) => ({
        ...p,
        edit: () => this.setState({ modalOpen: true, editing: p }),
        remove: () => this.setState((s) => ({ projects: s.projects.filter((x) => x.id !== p.id) }))
      })),
      techOptions: techNames.map((name) => {
        const on = sel.includes(name);
        return {
          name,
          color: on ? "#5ba3f5" : "#8b949e",
          border: on ? "#5ba3f5" : "rgba(255,255,255,.15)",
          toggle: () =>
            this.setState((s) => ({
              selectedTech: s.selectedTech.includes(name)
                ? s.selectedTech.filter((t) => t !== name)
                : [...s.selectedTech, name]
            }))
        };
      }),
      modalOpen: this.state.modalOpen,
      modalTitle: this.state.editing ? "Edit Project" : "Tambah Project",
      modalFieldTitle: this.state.editing ? this.state.editing.title : "",
      openAdd: () => this.setState({ modalOpen: true, editing: null }),
      closeModal: () => this.setState({ modalOpen: false }),
      stopClick: (e) => e.stopPropagation()
    };
  }
}

</script>
</body>
</html>

        <input type="password" placeholder="••••••••" style="font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:#e6edf3;background:#0e1116;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:12px 14px;outline:none" style-focus="border-color:#5ba3f5" />
      </div>
      <a href="Admin Dashboard.dc.html" style="font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;color:#0e1116;background:#5ba3f5;border-radius:8px;padding:13px;text-align:center;text-decoration:none;margin-top:4px" style-hover="opacity:.85">Masuk →</a>

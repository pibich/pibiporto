name: Keep Supabase alive

# Supabase free-tier projects pause after ~7 days of inactivity, which takes the
# database AND storage (uploaded images) offline. This job makes a tiny read
# request a few times a week so the project never goes idle. Runs independently
# of the deployed site, so it works even while the app has no traffic.

on:
  schedule:
    # Mon, Wed, Fri at 06:00 UTC — max gap ~3 days, well under the 7-day window.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "${SUPABASE_URL}/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
          echo "Supabase pinged successfully."
